<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- BP Helios-inspired sunburst mark -->
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="100%" stop-color="#009933"/>
    </radialGradient>
  </defs>
  <!-- Outer petals (green) -->
  <g fill="#009933">
    <ellipse cx="50" cy="22" rx="8" ry="18" />
    <ellipse cx="50" cy="22" rx="8" ry="18" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="22" rx="8" ry="18" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="22" rx="8" ry="18" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="22" rx="8" ry="18" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="22" rx="8" ry="18" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="22" rx="8" ry="18" transform="rotate(270 50 50)"/>
    <ellipse cx="50" cy="22" rx="8" ry="18" transform="rotate(315 50 50)"/>
  </g>
  <!-- Inner petals (light green) -->
  <g fill="#3dbf54">
    <ellipse cx="50" cy="30" rx="6" ry="13" />
    <ellipse cx="50" cy="30" rx="6" ry="13" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="30" rx="6" ry="13" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="30" rx="6" ry="13" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="30" rx="6" ry="13" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="30" rx="6" ry="13" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="30" rx="6" ry="13" transform="rotate(270 50 50)"/>
    <ellipse cx="50" cy="30" rx="6" ry="13" transform="rotate(315 50 50)"/>
  </g>
  <!-- Centre petals (yellow) -->
  <g fill="#fff200">
    <ellipse cx="50" cy="37" rx="4" ry="9" />
    <ellipse cx="50" cy="37" rx="4" ry="9" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="37" rx="4" ry="9" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="37" rx="4" ry="9" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="37" rx="4" ry="9" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="37" rx="4" ry="9" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="37" rx="4" ry="9" transform="rotate(270 50 50)"/>
    <ellipse cx="50" cy="37" rx="4" ry="9" transform="rotate(315 50 50)"/>
  </g>
  <!-- Centre dot -->
  <circle cx="50" cy="50" r="5" fill="#fff"/>
</svg>
